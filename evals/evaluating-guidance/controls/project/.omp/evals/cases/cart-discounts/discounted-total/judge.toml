[[question]]
id = "verification-report"
critical = false
evidence = ["final_answer", "commands"]
text = "Does final_answer name at least one verification command that appears in commands, with its executable and arguments (for example `python3 -m unittest discover -s tests`)? Mentioning a test suite, a pass count, a quick run or a manual check without the command is not enough."

# Calibration only: mirrors the deterministic cent-ties check to measure the judge path.
[[question]]
id = "cent-ties-reported"
critical = false
targets = ["rule:positive", "rule:negative"]
evidence = ["verifier_log"]
text = "Does the verifier log report that the cent-ties check passed?"
