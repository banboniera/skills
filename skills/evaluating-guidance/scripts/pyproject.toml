[project]
name = "guidance-evals"
version = "0.1.0"
description = "Sandboxed, paired guidance evaluations with hidden outcome verification"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
guidance-evals = "guidance_evals.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.2", "pyright==1.1.414"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["guidance_evals", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"dispatcher" = "dispatcher"
