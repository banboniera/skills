advisor:
  enabled: true
  reviewInterval: 3
bash:
  patterns:
    - approval: prompt
      match: git *push *--force-with-lease*
    - approval: prompt
      match: /usr/bin/git *push *--force-with-lease*
bashInterceptor:
  enabled: true
  patterns:
    - message: "Use the `edit` tool for repository files (`ast_edit` for the same structural change across many files), not `sed -i`. An in-place edit passes only when every file it names is under /tmp."
      pattern: "^\\s*(?:(?:do|then|else)\\s+)?(?:xargs\\s+(?:-\\S+\\s+)*)?sed\\s+(?:(?!-[a-zA-Z]*i|--in-place)(?:'[^']*'|\"[^\"]*\"|[^\\s'\"]\\S*)\\s+)*?(?:-[a-zA-Z]*i\\S*|--in-place\\S*)(?=\\s|$)(?!(?:\\s+-[a-zA-Z]+)*\\s+(?:'[^']*'|\"[^\"]*\")(?:\\s+[\"']?/(?:tmp/|dev/null)[^\\s;&|]*)+\\s*(?:$|[;&|\\n]))"
      tool: edit
    - message: "Use the `edit` tool for repository files (`ast_edit` for the same structural change across many files), not `perl -i`. An in-place edit passes only when every file it names is under /tmp."
      pattern: "^\\s*(?:(?:do|then|else)\\s+)?perl\\s+(?:-\\S+\\s+)*?-[a-zA-Z0-9]*i(?:\\.\\S*)?(?=\\s|$)(?!(?:\\s+-[a-zA-Z0-9]+)*\\s+(?:'[^']*'|\"[^\"]*\")(?:\\s+[\"']?/tmp/[^\\s;&|]*)+\\s*(?:$|[;&|\\n]))"
      tool: edit
browser:
  headless: false
checkpoint:
  enabled: true
claudeResets:
  autoRedeem5h: "no"
  autoRedeemFable: "no"
  autoRedeemWeekly: "no"
codexResets:
  autoRedeem5h: "no"
  autoRedeemWeekly: "no"
commands:
  enableClaudeUser: true
  enableOpencodeProject: false
composer:
  predictions: false
  shape: box
computer:
  enabled: true
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
disabledExtensions:
  - rule:go-add-cleanup
  - rule:go-bench-loop
  - rule:go-exp-promoted
  - rule:go-ioutil
  - rule:go-join-hostport
  - rule:go-new-expr
  - rule:go-rand-v2
  - rule:go-range-int
  - skill:using-git-worktrees
  - skill:writing-skills
disabledProviders:
  - claude
  - claude-md
  - codex
emojiAutocomplete: false
enabledModels:
  - anthropic/claude-fable-5-2
  - anthropic/claude-opus-5-5
  - anthropic/claude-sonnet-5-5
  - anthropic/claude-haiku-5-5
  - antigravity-cli/claude-opus-5-5
  - antigravity-cli/gemini-4-neon
  - antigravity-cli/gemini-4-argon
  - openai-codex/gpt-6-luna
  - openai-codex/gpt-6.1-terra
  - openai-codex/gpt-6.2-sol
  - openai-codex/gpt-6.2-astra
  - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  - openrouter/nvidia/nemotron-3.5-super-vl:free
  - openrouter/nvidia/nemotron-3.5-lightning:free
eval:
  autoBackground:
    enabled: true
features:
  unexpectedStopDetection: smart
find:
  enabled: "on"
  hitThreshold: 0.3
gc:
  compress: true
  stale: true
  strip: true
github:
  enabled: true
includeModelInPrompt: false
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
marketplace:
  autoUpdate: auto
memory:
  backend: mnemopi
mnemopi:
  enhancedRecall: true
  polyphonicRecall: true
  recallRelevance: auto
# Key order in modelRoles and retry.fallbackChains is significant: when no role
# hint matches, omp takes the first role assigned the live model.
modelRoles:
  advisor: openai-codex/gpt-6.2-sol:high
  commit: openrouter/nvidia/nemotron-3.5-super-vl:free
  default: anthropic/claude-opus-5-5
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6.2-sol:medium
  task: openai-codex/gpt-6.2-sol
  tiny: local/lfm2.5-230m
  vision: openai-codex/gpt-6.1-terra
  judge: openrouter/perplexity/pplx-decider-v1.3:free
  memory: openrouter/nvidia/nemotron-3.5-super-vl:free
  widget: openrouter/nvidia/nemotron-3.5-lightning:free
  web: web/brave
  council-opus: anthropic/claude-opus-5-5
  council-sol: openai-codex/gpt-6.2-sol
  council-astra: openai-codex/gpt-6.2-astra
  council-argon: antigravity-cli/gemini-4-argon
  council-neon: antigravity-cli/gemini-4-neon
personality: pragmatic
plan:
  autosave: true
providers:
  openaiLiveSteering: true
  openaiResponsesWebsockets: true
  tinyModelDevice: cuda
retry:
  fallbackChains:
    anthropic/*:
      - anthropic-key/*
    default:
      - openai-codex/gpt-6.2-sol
    slow:
      - openai-codex/gpt-6.2-sol:xhigh
    task:
      - anthropic/claude-opus-5-5:medium
    tiny: []
    memory:
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - local/qwen2.5-1.5b
    commit:
      - openai-codex/gpt-6-luna:low
    widget:
      - openai-codex/gpt-6.2-sol:low
    judge:
      - openrouter/liquid/d1.2-ultra
    advisor:
      - anthropic/claude-opus-5-5:medium
    web:
      - web/exa
      - web/firecrawl
      - web/parallel
      - web/tinyfish
      - web/tavily
      - web/hosted
      - web/public
    vision:
      - anthropic/claude-opus-5-5:medium
      - openai-codex/gpt-6.2-sol
      - openrouter/nvidia/nemotron-3.5-super-vl:free
    # Council members fail instead of switching models; the council skill drops
    # them. Keep these last so council-sol never captures a session on Sol.
    council-opus: []
    council-sol: []
    council-astra: []
    council-argon: []
    council-neon: []
  usageAwareFallback: true
secrets:
  enabled: true
security:
  enabled: true
setupVersion: 3
skills:
  ignoredSkills:
    - ponytail
startup:
  quiet: true
statusLine:
  compactThinkingLevel: false
  leftSegments:
    - path
    - model
    - mode
  preset: custom
  rightSegments:
    - git
    - context_pct
    - token_rate
  segmentOptions:
    git:
      showStaged: false
      showUnstaged: false
      showUntracked: false
    path:
      maxLength: 30
  separator: block
  transparent: true
task:
  agentModelOverrides:
    code-simplifier: "@smol"
    error-analyzer: "@task"
    reviewer: openai-codex/gpt-6.2-sol
    scout: openai-codex/gpt-6.1-terra:medium
    security-reviewer: openai-codex/gpt-6.2-astra:high
    sonic: openai-codex/gpt-6.2-sol:low
  autoParallel: suggest
  enableEffort: true
  isolation:
    enabled: true
  maxEffort: high
  showResolvedModelBadge: true
tier:
  subagent: priority  # options: inherit | none | auto | default | flex | scale | priority | ultrafast
title:
  refreshOnReplan: false
todo:
  remindersMax: 0
tools:
  intentTracing: false
  restrictedFolders:
    - ~/.aws
    - ~/.claude/.credentials.json
    - ~/.coderabbit/auth.json
    - ~/.codex/auth.json
    - ~/.config/cloudflare-zone-token
    - ~/.config/gcloud
    - ~/.config/gh
    - ~/.config/mozilla
    - ~/.convex/config.json
    - ~/.docker/config.json
    - ~/.gnupg
    - ~/.local/share/keyrings
    - ~/.omp/agent/.env
    - ~/.omp/agent/agent.db
    - ~/.omp/agent/agent.db-wal
    - ~/.omp/agent/secret-placeholder.key
    - ~/.password-store
    - ~/.pki
    - ~/.posthog/credentials.json
    - ~/.sentryclirc
    - ~/.ssh
    - ~/.var/app/com.google.Chrome
ttsr:
  repeatGap: 150
  repeatMode: after-gap
tui:
  textSizing: true
update:
  auto: true
